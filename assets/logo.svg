<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Margelet">
  <title>Margelet</title>
  <!--
    Тот же знак, что в приложении, но векторный: пастельно-зелёное поле и
    бумажный самолётик носом на зрителя.

    Координаты взяты из рисовалки иконки (icon.py): поле 108 на 108, центр
    самолёта поднят на три процента высоты. Подъём нужен потому, что вся масса
    самолёта внизу, в развале крыльев: посаженный по геометрическому центру, он
    выглядит съехавшим вниз.

    Скругление 24 — форма для случаев, где маску никто не накладывает (гитхаб,
    сайт). В самом приложении фон квадратный во всё поле, а форму выбирает
    лаунчер своей маской.
  -->
  <rect width="108" height="108" rx="24" fill="#8DD1B0"/>
  <!-- левое крыло -->
  <path d="M54 29.88 L27.55 67.46 L52.05 59.11 Z" fill="#FFFFFF"/>
  <!-- правое крыло, чуть темнее: иначе плоскости сливаются -->
  <path d="M54 29.88 L80.45 67.46 L55.95 59.11 Z" fill="#EEF3FA"/>
  <!-- корпус: ребро сгиба, самое тёмное -->
  <path d="M54 29.88 L52.05 59.11 L54 64.12 L55.95 59.11 Z" fill="#CCD5E9"/>
</svg>
